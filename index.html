<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extension of Hours – London Cranfield Airport</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f7f9fb; --ink:#0d1b2a; --ink2:#55657a; --ink3:#8795a7; --line:#e4e9ef; --line-2:#d2dae4;
  --navy:#0c4772; --navy-ink:#ffffff; --navy-50:#eaf1f8; --navy-100:#d6e4f1; --red:#e4013a; --red-50:#fdedf1;
  --ok:#0f7a4a; --ok-50:#e8f6ef; --bad:#c3102f; --bad-50:#fdedf0; --warn:#9a5a00; --warn-50:#fff3df; --wait:#5f6f83; --wait-50:#eef2f6;
  --btn:#0c4772; --btn-h:#0a3c61;
  --shadow-sm:0 1px 2px rgba(13,27,42,.05);
  --shadow:0 1px 2px rgba(13,27,42,.04),0 4px 14px rgba(13,27,42,.06);
  --shadow-lg:0 10px 40px rgba(13,27,42,.18);
  --ring:0 0 0 3px rgba(12,71,114,.20);
  --r:12px; --r-sm:8px;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1219; --surface:#111b25; --surface-2:#0e1720; --ink:#e6edf4; --ink2:#9aabbd; --ink3:#6c7e92; --line:#1e2b38; --line-2:#2a3a4b;
    --navy:#8cbce8; --navy-ink:#0a1219; --navy-50:#132638; --navy-100:#1a3350; --red:#ff5a7a; --red-50:#3a1520;
    --ok:#53d29b; --ok-50:#0f2c20; --bad:#ff7d93; --bad-50:#38141d; --warn:#f2be5c; --warn-50:#30240c; --wait:#9aabbd; --wait-50:#192531;
    --btn:#2f6ea8; --btn-h:#3a7cb8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    --ring:0 0 0 3px rgba(140,188,232,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1219; --surface:#111b25; --surface-2:#0e1720; --ink:#e6edf4; --ink2:#9aabbd; --ink3:#6c7e92; --line:#1e2b38; --line-2:#2a3a4b;
  --navy:#8cbce8; --navy-ink:#0a1219; --navy-50:#132638; --navy-100:#1a3350; --red:#ff5a7a; --red-50:#3a1520;
  --ok:#53d29b; --ok-50:#0f2c20; --bad:#ff7d93; --bad-50:#38141d; --warn:#f2be5c; --warn-50:#30240c; --wait:#9aabbd; --wait-50:#192531;
  --btn:#2f6ea8; --btn-h:#3a7cb8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(140,188,232,.28);
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));height:auto}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.num,time,.z,.l,td.when{font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--ring)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--ring)}

/* header */
.brand{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.brand-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo-tile{background:#fff;border-radius:10px;padding:5px 7px;display:flex;flex:none;box-shadow:0 0 0 1px var(--line)}
.logo-tile img{display:block;height:34px;width:auto}
.brand-text{flex:1;min-width:0}
.acts{flex:none}
.brand-sub{color:var(--ink3);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.brand h1{font-size:19px;line-height:1.2}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 72px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;min-height:38px;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.primary:hover{background:var(--btn-h);border-color:var(--btn-h)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.btn.danger:hover{background:var(--bad-50);border-color:var(--bad)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--wait-50)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 11px;min-height:32px;font-size:13.5px}
.linkish{border:0;background:none;color:var(--navy);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,var(--navy) 40%,transparent)}

/* department bay */
.bay-label{margin:0 0 10px;color:var(--ink3);font-size:12.5px;font-weight:700;letter-spacing:.02em}
.bay{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dept{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:96px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s,transform .15s}
.dept:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.dept.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy),var(--shadow)}
.dept.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-name{font-weight:700;font-size:15px}
.d-mine{font-size:11.5px;font-weight:700;color:var(--navy);background:var(--navy-50);padding:2px 8px;border-radius:999px;white-space:nowrap}
.d-stats{display:flex;gap:18px}
.d-stat{display:flex;align-items:baseline;gap:6px;color:var(--ink2);font-size:13px;font-weight:600}
.d-stat b{font-size:26px;line-height:1;font-weight:800;color:var(--red);letter-spacing:-.02em}
.d-clear{display:flex;align-items:center;gap:8px;color:var(--ink3);font-size:13.5px;font-weight:600}
.ok-ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ok-50);color:var(--ok);font-size:11px;font-weight:800}
.d-over{font-size:12px;font-weight:700;color:var(--bad)}
.bay-hint{margin:10px 0 0;color:var(--ink2);font-size:13.5px}
.bay-hint:empty{display:none}

.note{margin:16px 0 0;padding:10px 14px;border-radius:var(--r-sm);background:var(--warn-50);color:var(--warn);font-size:13.5px;font-weight:600}
.note.info{background:var(--navy-50);color:var(--navy)}

/* controls */
.controls{display:flex;flex-direction:column;gap:12px;margin:26px 0 14px}
.tabs{display:inline-flex;align-self:flex-start;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2);min-height:34px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2);min-height:32px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.ctl-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:440px}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:none;stroke:var(--ink3);stroke-width:2;stroke-linecap:round;pointer-events:none}

.tg{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tg input{width:16px;height:16px;min-height:0;margin:0;accent-color:var(--navy)}

/* request cards */
.rqs{display:grid;gap:10px}
.rq{position:relative;display:grid;grid-template-columns:212px minmax(0,1fr) 352px 188px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s,transform .15s}
.rq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--line-2))}
.rq:hover{box-shadow:var(--shadow);border-color:var(--line-2);transform:translateY(-1px)}
.rq>*{padding:14px 16px}
.rq.k-checking{--acc:var(--wait)} .rq.k-ready{--acc:var(--navy)} .rq.k-blocked,.rq.k-rejected{--acc:var(--bad)} .rq.k-confirmed{--acc:var(--ok)} .rq.k-closed{--acc:var(--navy-100)} .rq.k-cancelled{--acc:var(--line-2)}
.rq.past,.rq.dim{opacity:.6}
.rq-time{padding-left:20px;border-right:1px solid var(--line)}
.rq-date{font-weight:700;font-size:14px;color:var(--ink2);margin-bottom:6px}
.rq-mv{margin:2px 0}
.mv{display:inline-flex;align-items:baseline;gap:8px}
.mvk{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--ink3);width:26px}
.z{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.l{font-size:12.5px;font-weight:600;color:var(--ink3)}
.rq-hrs{margin-top:8px;display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--wait-50);color:var(--ink2)}
.rq-hrs.out{background:var(--red-50);color:var(--red)}
.rq-main{min-width:0}
.rq-title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reg{font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--navy-50);color:var(--navy)}
.rq-sub{color:var(--ink2);font-size:13.5px;font-weight:600;margin-top:2px}
.rq-det{color:var(--ink2);font-size:13.5px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.rq-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--ink3);font-weight:600}
.flag{font-weight:700}
.flag.urgent{color:var(--bad)} .flag.live{color:var(--ok)} .flag.info{color:var(--warn)}
.rq-deps{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:center;border-left:1px solid var(--line)}
.dp{display:grid;grid-template-columns:8px auto 1fr;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;background:var(--surface-2);min-width:0;font-size:12.5px}
.dp .dot,.dr .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dp .dn{font-weight:800;color:var(--ink)}
.dp .dw{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.st-available .dot{background:var(--ok)} .dp.st-available{background:var(--ok-50)} .dp.st-available .dw{color:var(--ok);font-weight:600}
.st-unavailable .dot{background:var(--bad)} .dp.st-unavailable{background:var(--bad-50)} .dp.st-unavailable .dw{color:var(--bad);font-weight:600}
.st-pending .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--ink3)}
.dp.st-none{opacity:.5}
.st-none .dot{background:var(--line-2)}
.rq-status{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px;border-left:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px;line-height:1.4}
.tag::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.rq-status .tag{align-items:center;text-align:left;border-radius:10px;padding:5px 10px}
.tag.checking,.tag.cancelled{background:var(--wait-50);color:var(--wait)}
.tag.ready{background:var(--navy-50);color:var(--navy)}
.tag.confirmed{background:var(--ok-50);color:var(--ok)}
.tag.blocked,.tag.rejected{background:var(--bad-50);color:var(--bad)}
.tag.closed{background:var(--navy-50);color:var(--navy)}
.prog{display:flex;gap:4px;width:100%}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.done{background:var(--ok)} .prog i.now{background:var(--navy)} .prog i.bad{background:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:48px 24px;text-align:center;color:var(--ink2)}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{max-width:560px;margin:0 auto}
.empty .btn{margin-top:16px}
@media (max-width:1080px){
  .rq{grid-template-columns:180px minmax(0,1fr)}
  .rq-deps{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);grid-template-columns:repeat(4,minmax(0,1fr))}
  .rq-status{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);flex-direction:row;align-items:center;padding-top:10px;padding-bottom:10px}
  .rq-status .prog{max-width:160px;margin-left:auto}
}
@media (max-width:640px){
  .bay{grid-template-columns:1fr 1fr;gap:8px}
  .dept{padding:12px;min-height:84px}
  .rq{grid-template-columns:1fr}
  .rq-time{border-right:0;border-bottom:1px solid var(--line)}
  .rq-deps{grid-template-columns:1fr 1fr}
  .wrap,.brand-in{padding-left:14px;padding-right:14px}
  .brand-sub{display:none}
  .acts .btn:not(.primary){display:none}
  .brand h1{font-size:17px}
}

/* schedule */
.wk-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-nav h2{font-size:17px;margin:0 8px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:170px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow-sm)}
.day.today{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy),var(--shadow-sm)}
.day h3{font-size:13.5px;color:var(--ink2)}
.day.today h3{color:var(--navy)}
.day .hrs{font-size:12px;color:var(--ink3);margin-top:-6px;font-weight:600}
.day .none{color:var(--ink3);font-size:12.5px;margin-top:auto;margin-bottom:auto;text-align:center}
.ev{display:grid;grid-template-columns:4px 1fr;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;overflow:hidden;cursor:pointer;padding:0;transition:border-color .15s,box-shadow .15s}
.ev:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.ev .band{display:block}
.band.b-checking{background:var(--wait)} .band.b-ready{background:var(--navy)} .band.b-blocked,.band.b-rejected{background:var(--bad)} .band.b-confirmed{background:var(--ok)} .band.b-closed{background:var(--navy-100)} .band.b-cancelled{background:var(--line-2)}
.ev .in{padding:7px 9px;min-width:0}
.ev .t .z{font-size:14px}
.ev .k{font-size:12px;color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .k.confirmed{color:var(--ok)} .ev .k.ready,.ev .k.closed{color:var(--navy)} .ev .k.blocked{color:var(--bad)}
.cap{color:var(--ink3);font-size:12.5px;margin:12px 0 0;font-weight:500}
@media (max-width:900px){.week{grid-template-columns:1fr}.day{min-height:0}}

/* history */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse;min-width:720px;font-size:14px}
.tbl th,.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:var(--ink3);font-size:12px;letter-spacing:.03em;background:var(--surface-2)}
.tbl td.when{white-space:nowrap;color:var(--ink2);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.more{text-align:center;margin-top:14px}

/* admin */
.admin{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow-sm)}
.card h2{font-size:17px}
.card>p.lead{margin:4px 0 16px;color:var(--ink2);font-size:14px;max-width:760px}
.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.teams{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.teams{grid-template-columns:1fr}}
.team{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);min-width:0}
.team h3{font-size:14px;margin-bottom:8px}
.team ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.team li{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;font-size:13.5px;font-weight:600}
.team li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .none{color:var(--ink3);font-size:13px;margin:0 0 10px}
.hits{display:grid;gap:4px;margin-top:6px}
.hits button{justify-content:flex-start}
.hrsgrid{display:grid;grid-template-columns:110px 1fr 1fr 90px;gap:8px 12px;align-items:center;max-width:580px;font-size:14px;font-weight:600}
.hrsgrid .h{color:var(--ink3);font-size:12px;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card .save{margin-top:16px}
.rules label.ck{align-self:start}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:100%;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(8,18,28,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
dialog[open]{display:flex;flex-direction:column}
#detail{margin:0 0 0 auto;height:100%;max-height:100%;width:min(640px,100%);border-radius:16px 0 0 16px}
.mdl{width:min(700px,calc(100% - 24px));max-height:calc(100% - 24px);margin:auto;border-radius:16px}
.mdl form{display:flex;flex-direction:column;min-height:0;flex:1}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px 14px}
.dlg-head h2{font-size:21px;line-height:1.25;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ref{color:var(--ink3);font-size:12.5px;font-weight:700;letter-spacing:.02em;margin-bottom:2px}
.icon{border:0;background:var(--wait-50);color:var(--ink2);border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none;line-height:1;font-size:14px;transition:background .15s}
.icon:hover{background:var(--line-2);color:var(--ink)}
.dlg-body{padding:6px 24px 20px;overflow:auto;flex:1;min-height:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface-2)}
.dlg-foot .spacer{margin-right:auto}
.dlg-body h3{font-size:13px;color:var(--ink3);letter-spacing:.03em;margin:24px 0 10px}
.tagrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.tagrow .flag{font-size:13px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
ol.steps li{display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink3)}
ol.steps li .sd{height:4px;border-radius:4px;background:var(--line)}
ol.steps li.done{color:var(--ok)} ol.steps li.done .sd{background:var(--ok)}
ol.steps li.now{color:var(--navy)} ol.steps li.now .sd{background:var(--navy)}
ol.steps li.bad{color:var(--bad)} ol.steps li.bad .sd{background:var(--bad)}
dl.facts{margin:0;display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
dl.facts div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
dl.facts div:last-child{border-bottom:0}
dl.facts dt{color:var(--ink3);font-size:13px;font-weight:600}
dl.facts dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
dl.facts strong{font-weight:800}
.loc{color:var(--ink3);font-weight:600;font-size:13px;margin-left:4px}
.outhrs{color:var(--red);font-weight:700;font-size:13px}
ul.resp{list-style:none;padding:0;margin:0;display:grid;gap:8px}
li.dr{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
li.dr.st-none{background:var(--surface-2);padding:10px 14px}
.r-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.r-name{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:9px}
.r-note{margin:8px 0 0;overflow-wrap:anywhere;font-size:14px}
.lbl{display:inline-block;min-width:76px;color:var(--ink3);font-weight:700;font-size:12.5px;margin-right:6px}
.r-by{color:var(--ink3);font-size:12.5px;margin-top:6px;font-weight:500}
.r-ctl{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:10px}
.fl{display:grid;gap:5px}
.fl span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fl em{font-style:normal;font-weight:600;color:var(--ink3)}
.r-btns{display:flex;gap:6px;flex-wrap:wrap}
.co{border-radius:var(--r);background:var(--navy-50);padding:12px 14px;margin-top:14px}
.decide{border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);padding:14px 16px;margin-top:14px}
.decide h3{margin:0 0 4px!important;font-size:15px!important;color:var(--ink)!important;letter-spacing:0!important}
.decide.ok{background:var(--ok-50);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.decide.bad{background:var(--bad-50);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.decide textarea{background:var(--surface)}
.hint{color:var(--ink2);font-size:13px;margin:6px 0 0}
.hint.warn{color:var(--warn);font-weight:600}
.hint.out{color:var(--red);font-weight:700}
textarea,input[type=text],input[type=password],input[type=search],input[type=email],input[type=number],input[type=time],input[type=date],input[type=datetime-local],select,input:not([type]){width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;min-height:40px;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus,select:focus{border-color:var(--navy);box-shadow:var(--ring);outline:none}
::placeholder{color:var(--ink3);opacity:1}
.search input[type=search]{padding-left:36px}
textarea{resize:vertical}
ol.log{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0;position:relative}
ol.log li{position:relative;padding:0 0 14px 20px}
ol.log li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
ol.log li::after{content:"";position:absolute;left:7px;top:18px;bottom:0;width:1px;background:var(--line)}
ol.log li:last-child::after{display:none}
ol.log .w{font-weight:700;font-size:13.5px}
ol.log time{color:var(--ink3);font-size:12.5px;margin-left:8px;font-weight:600}
ol.log p{margin:2px 0 0;overflow-wrap:anywhere;font-size:14px;color:var(--ink2)}
.fields{display:grid;gap:16px}
.fields>label,.fields fieldset,.row2 label,.row3 label{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--ink2);border:0;padding:0;margin:0;min-width:0}
.fields legend{font-weight:700;font-size:13px;color:var(--ink2);padding:0;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
@media (max-width:600px){.row2,.row3{grid-template-columns:1fr}.hrsgrid{grid-template-columns:80px 1fr 1fr 70px}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg legend{grid-column:1/-1}
.seg label{position:relative;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;background:var(--surface);display:block;font-weight:700;font-size:14px;color:var(--ink);text-align:center;transition:border-color .15s,background .15s}
.seg label:hover{border-color:var(--ink3)}
.seg label:has(input:checked){border-color:var(--navy);background:var(--navy-50);color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.seg label:has(input:focus-visible){box-shadow:var(--ring)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.chks{display:flex!important;flex-wrap:wrap;gap:8px}
.chks label,label.ck{display:inline-flex!important;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink)}
.chks label:has(input:checked){border-color:var(--navy);background:var(--navy-50);color:var(--navy)}
label.ck{border-radius:var(--r-sm)}
.chks input,label.ck input,.hrsgrid input[type=checkbox]{width:16px;height:16px;min-height:0;margin:0;accent-color:var(--navy)}
.err{color:var(--bad);font-weight:700;margin:0;min-height:1.2em;font-size:14px}
.mvrow{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px 12px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface-2)}
.mvrow label{display:grid;gap:6px;font-weight:700;font-size:12.5px;color:var(--ink3)}
.mvrow .mvlbl{font-weight:800;font-size:15px;color:var(--ink);padding-top:30px}
.mvrow input[name$="Time"]{font-variant-numeric:tabular-nums;letter-spacing:.08em;font-weight:800;font-size:16px}
.mvhint{grid-column:2/4;margin:0}
@media (max-width:560px){.mvrow{grid-template-columns:1fr 1fr}.mvrow .mvlbl,.mvhint{grid-column:1/-1;padding-top:0}.seg3{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;z-index:50;max-width:calc(100% - 32px);font-weight:600;font-size:14px;display:none;box-shadow:var(--shadow-lg)}
#toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:fade .18s ease-out}
  #detail[open]{animation:slide .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}
/* ===== Brand theme built around the London Cranfield Airport logo ===== */
:root{--brand:#0c4772;--brand-deep:#0a3a5e;--brand-red:#e4013a;--brand-wine:#801527;--slab:"Zilla Slab","Rockwell","Roboto Slab",Georgia,serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#0b3a5d;--brand-deep:#082c47}}
:root[data-theme="dark"]{--brand:#0b3a5d;--brand-deep:#082c47}
:root{--bad:#b0102f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bad:#ff7d93}}
:root[data-theme="dark"]{--bad:#ff7d93}

/* header band */
.brand{position:relative;z-index:0;background:linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%);border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brand-red)}
.brand-in{padding:22px 24px 74px;gap:22px;align-items:center}
.logo-tile{background:#fff;border-radius:14px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.22);flex:none}
.logo-tile img{height:92px;width:auto;border-radius:6px}
.brand-sub{color:rgba(255,255,255,.72);font-size:11.5px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.brand-sub::after{content:"";height:2px;width:44px;background:var(--brand-red);border-radius:2px}
.brand h1{font-family:var(--slab);font-weight:700;font-size:36px;line-height:1.1;color:#fff;letter-spacing:0;margin-top:6px}
.brand-tag{color:rgba(255,255,255,.75);font-size:14px;margin-top:6px;font-weight:500}
.brand .btn{box-shadow:none}
.brand .btn.primary{background:#fff;color:var(--brand);border-color:#fff}
.brand .btn.primary:hover{background:#eef3f8;border-color:#eef3f8}
.brand .btn:not(.primary){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#fff}
.brand .btn:not(.primary):hover{background:rgba(255,255,255,.16)}
.brand .btn[disabled]{opacity:.5}
.brand .btn:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.45)}

/* content overlaps the band */
.wrap{padding-top:0}
.bay-wrap{margin-top:-52px;position:relative;z-index:2}
.bay-label{color:rgba(255,255,255,.78);letter-spacing:.24em;text-transform:uppercase;font-size:11px;margin-bottom:10px}
.dept{border-radius:14px;box-shadow:0 4px 18px rgba(13,27,42,.10);border-color:transparent;padding:16px 18px}
.dept:hover{box-shadow:0 8px 28px rgba(13,27,42,.14);transform:translateY(-1px)}
.dept.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy),0 8px 28px rgba(13,27,42,.14)}
.dept.on::after{left:18px;right:18px;height:3px;background:var(--brand-red)}
.d-name{font-family:var(--slab);font-size:18px;font-weight:700;color:var(--navy)}
.d-stat b{font-family:var(--slab);font-size:32px;font-weight:700;color:var(--brand-red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .d-stat b{color:var(--red)}}
:root[data-theme="dark"] .d-stat b{color:var(--red)}
.d-mine{background:var(--red-50);color:var(--brand-red)}

/* section labels echo "A I R P O R T" */
.dlg-body h3:not(.decide h3),.tbl th,.hrsgrid .h{text-transform:uppercase;letter-spacing:.16em;font-size:11px}
.card h2,.empty h2,.wk-nav h2{font-family:var(--slab);font-weight:700;font-size:21px;color:var(--navy)}
.empty{border-style:solid;border-color:var(--line)}

/* tabs: underline style with red marker */
.controls{margin-top:30px}
.tabs{background:transparent;padding:0;gap:4px;border-radius:0;border-bottom:1px solid var(--line);align-self:stretch}
.tabs button{border-radius:0;padding:10px 14px;min-height:42px;position:relative;font-size:14.5px}
.tabs button[aria-selected="true"]{background:transparent;box-shadow:none;color:var(--navy)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand-red)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip .cnt{background:var(--brand-red)}

/* request cards */
.rq{border-radius:14px;border-color:transparent;box-shadow:0 1px 3px rgba(13,27,42,.06),0 1px 0 var(--line)}
.rq:hover{box-shadow:0 8px 26px rgba(13,27,42,.10)}
.rq::before{width:5px}
.rq.k-blocked,.rq.k-rejected{--acc:var(--brand-wine)}
.rq-title{font-family:var(--slab);font-size:19px;font-weight:700;color:var(--navy)}
.reg{font-family:"Plus Jakarta Sans",sans-serif;background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .reg{background:var(--navy-100);color:var(--navy)}}
:root[data-theme="dark"] .reg{background:var(--navy-100);color:var(--navy)}
.rq-date{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.z{font-size:19px}
.rq-hrs.out{background:var(--red-50);color:var(--brand-red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rq-hrs.out{color:var(--red)}}
:root[data-theme="dark"] .rq-hrs.out{color:var(--red)}

/* dialogs: navy heads with the red rule */
.dlg-head{background:linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%);color:#fff;border-bottom:3px solid var(--brand-red);padding:20px 24px 18px}
#detail .dlg-head{border-radius:16px 0 0 0}
.mdl .dlg-head{border-radius:16px 16px 0 0}
.dlg-head h2{font-family:var(--slab);font-weight:700;font-size:25px;color:#fff}
.dlg-head .ref{color:rgba(255,255,255,.7);letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.dlg-head .s-ac{font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.16);color:#fff}
.dlg-head .icon{background:rgba(255,255,255,.14);color:#fff}
.dlg-head .icon:hover{background:rgba(255,255,255,.26)}
.dlg-body{padding-top:18px}
.decide h3{font-family:var(--slab)!important;font-size:17px!important}
.btn.primary{background:var(--btn)}
.btn.danger{color:var(--bad)}

@media (max-width:760px){
  .brand-in{padding:16px 16px 64px;gap:14px}
  .logo-tile{padding:5px;border-radius:10px}
  .logo-tile img{height:58px}
  .brand h1{font-size:25px}
  .brand-tag{display:none}
  .brand-sub{letter-spacing:.2em;font-size:10px}
  .brand-sub::after{display:none}
}
@media (max-width:520px){
  .brand-in{flex-wrap:wrap}
  .acts{width:100%}
  .acts .btn.primary{flex:1}
}
@media (max-width:640px){.d-stats{gap:4px 12px;flex-wrap:wrap}.d-stat{white-space:nowrap}.d-stat b{font-size:26px}.d-name{font-size:16px}}

/* reversed logo sits directly on the navy band */
.brand .logo-tile{background:transparent;box-shadow:none;padding:0;border-radius:0}
.brand .logo-tile img{height:110px;width:auto;border-radius:0}
.brand-in{gap:28px}
.brand-text{padding-left:28px;border-left:1px solid rgba(255,255,255,.18)}
@media (max-width:760px){.brand .logo-tile img{height:72px}.brand-in{gap:16px}.brand-text{padding-left:16px}}

[hidden]{display:none!important}
/* ===== sign-in gate ===== */
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(1200px 600px at 20% -10%,#14598c 0%,transparent 60%),linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%);position:relative}
.gate::after{content:"";position:fixed;left:0;right:0;bottom:0;height:3px;background:var(--brand-red)}
.g-card{width:min(440px,100%);background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.g-brand{display:flex;align-items:center;gap:18px;padding:22px 26px;background:linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%);border-bottom:3px solid var(--brand-red)}
.g-brand img{height:72px;width:auto}
.g-title{font-family:var(--slab);font-weight:700;font-size:24px;color:#fff;line-height:1.15;margin-top:4px}
.g-brand .brand-sub::after{display:none}
.g-body{padding:24px 26px 26px}
.g-body h2{font-family:var(--slab);font-size:22px;color:var(--navy)}
.g-lead{color:var(--ink2);font-size:14.5px;margin:6px 0 18px}
#gform{display:grid;gap:14px}
#gform label{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--ink2)}
.g-main{width:100%;min-height:44px;font-size:15px;margin-top:4px}
.g-alt{margin-top:16px;font-size:13.5px;color:var(--ink2);text-align:center}
.g-sep{margin:0 8px;color:var(--ink3)}
.g-ok{color:var(--ok);font-weight:600;font-size:14px;margin:0}
.g-ok:empty,#gerr:empty{display:none}
/* signed-in user in header */
.who{display:inline-flex;align-items:center;gap:10px;margin-left:6px;padding-left:14px;border-left:1px solid rgba(255,255,255,.22);color:#fff;font-size:13.5px;font-weight:600}
.who-out{background:none;border:0;color:rgba(255,255,255,.75);cursor:pointer;font-weight:600;font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.who-out:hover{color:#fff}
@media (max-width:760px){.who{display:none}}
/* people table */
.utbl{min-width:640px}
.utbl td.c,.utbl th:not(:first-child){text-align:center}
.utbl td{vertical-align:middle}
.utbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy);cursor:pointer}
.utbl tr.pending td{background:color-mix(in srgb,var(--warn-50) 60%,transparent)}
.u-n{font-weight:700}
.u-e{font-size:12.5px;color:var(--ink3)}
.u-new{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-50);padding:2px 7px;border-radius:999px;margin-left:4px}
</style>

<body>
<div id="gate" class="gate" hidden></div>
<div id="app" hidden>

<script>

"use strict";
/* ===== configuration (set in the PORTAL_CONFIG block at the top of the page) ===== */
const CFG=window.PORTAL_CONFIG||{};

/* ===== constants ===== */

  {id:'OPS',short:'Ops',name:'Airport Ops'},
  {id:'ATC',short:'ATC',name:'ATC'},
  {id:'RFFS',short:'RFFS',name:'RFFS'},
  {id:'HND',short:'FBO',name:'FBO (Handling)'}

const REQUESTERS=['OPS','HND'];
const MOVES={arr:'Arrival',dep:'Departure',both:'Arrival and departure'};
const STATE={
  available:{glyph:'\u2713',cell:'Can do',full:'Can accommodate'},
  unavailable:{glyph:'\u2715',cell:'Cannot',full:'Cannot accommodate'},
  pending:{glyph:'\u25CB',cell:'Checking',full:'Checking'}
};
const LEGACY={confirmed:'available',conditional:'available',declined:'unavailable'};
const DEFAULTS={hours:{},shortNoticeH:48,urgentH:24,respondWithinH:0,respondBeforeStartH:0,closeoutDueH:24,opsOverride:true};
const FIELDS={operator:'Operator',reg:'Callsign or registration',acType:'Aircraft type',fireCat:'Required Fire Cat',movement:'Movement',arr:'Arrival',dep:'Departure',details:'Details',contact:'Operator contact',reqDept:'Requesting department',required:'Departments checking'};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYNAME=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WEEKORDER=[1,2,3,4,5,6,0];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LONP=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});

/* ===== helpers ===== */
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function fmtDur(ms){const m=Math.round(ms/60000),h=Math.floor(m/60),mm=m%60;return h&&mm?h+'h '+mm+'m':h?h+'h':mm+'m';}
const rid=()=>Math.random().toString(36).slice(2,6);
const lid=()=>'l'+Date.now().toString(36)+rid();
function newRef(){const d=new Date(),a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<3;i++)s+=a[Math.floor(Math.random()*a.length)];return 'EXT-'+String(d.getUTCFullYear()).slice(2)+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'-'+s;}
const hm=s=>{const p=String(s||'').split(':');return (+p[0])*60+(+p[1]||0);};
const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'\u2026':s;};

const uT=d=>pad(d.getUTCHours())+pad(d.getUTCMinutes())+'Z';
const uDate=d=>DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()];
const uDT=d=>uDate(d)+' '+uT(d);
function lon(d){const o={};LONP.formatToParts(d).forEach(p=>{o[p.type]=p.value;});return o;}
const lT=d=>{const p=lon(d);return p.hour+p.minute+'L';};
const lDT=d=>{const p=lon(d);return p.weekday+' '+(+p.day)+' '+MON[+p.month-1]+' '+p.hour+p.minute+'L';};
const isoDate=d=>d.toISOString().slice(0,10);
function mkISO(date,time){const m=/^\s*([01]\d|2[0-3]):?([0-5]\d)\s*$/.exec(time||'');if(!date||!m)return null;return date+'T'+m[1]+':'+m[2]+':00Z';}
const splitISO=iso=>iso?[iso.slice(0,10),iso.slice(11,13)+iso.slice(14,16)]:['',''];
function mondayUTC(d){const x=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x;}
const dept=id=>DEPTS.find(d=>d.id===id)||{id:id,short:id||'?',name:id||'Unknown'};
const opName=r=>r.operator||r.who||'Unnamed operator';

/* ===== local store for preview ===== */
function makeLocalDb(){
  const store=new Map(),subs=new Set();
  const merge=(a,b)=>{const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object')?merge(o[k],v):v;}return o;};
  const notify=()=>subs.forEach(f=>f());
  const snap=p=>({id:p.split('/').pop(),exists:store.has(p),data:()=>store.get(p)});
  const docRef=p=>({id:p.split('/').pop(),path:p,
    set:async d=>{store.set(p,JSON.parse(JSON.stringify(d)));notify();},
    update:async d=>{if(!store.has(p))throw {code:'invalid_argument',message:'missing'};store.set(p,merge(store.get(p),JSON.parse(JSON.stringify(d))));notify();},
    delete:async()=>{store.delete(p);notify();},
    onSnapshot:next=>{const f=()=>next(snap(p));subs.add(f);f();return()=>subs.delete(f);}});
  return {doc:docRef,collection:c=>({
    doc:id=>docRef(c+'/'+(id||('l'+rid()+rid()))),
    onSnapshot:next=>{const n=c.split('/').length+1;const f=()=>next({docs:[...store.keys()].filter(k=>k.startsWith(c+'/')&&k.split('/').length===n).map(snap)});subs.add(f);f();return()=>subs.delete(f);}
  })};
}

/* ===== roster & permissions ===== */
function rosterActive(){return true;}
function myTeams(){return rosterActive()?(((roster.members||{})[me.id])||[]):(ui.dept?[ui.dept]:[]);}
function canOverride(){return rosterActive()&&(canAdmin||(S('opsOverride')&&myTeams().includes('OPS')));}
function respondMode(d){if(!canWrite)return null;if(myTeams().includes(d))return 'own';if(canOverride())return 'override';return null;}
function decideMode(r){if(!canWrite)return null;if(myTeams().includes(r.reqDept))return 'own';if(canOverride()||(!rosterActive()&&canAdmin))return 'override';return null;}
function canRaise(){return canWrite&&(rosterActive()?(myTeams().some(t=>REQUESTERS.includes(t))||canAdmin||canOverride()):true);}
const canManage=r=>!!decideMode(r);
function canCloseout(){return canWrite&&(!rosterActive()||myTeams().length>0||canAdmin);}

/* ===== movements ===== */
function moves(r){
  const out=[],m=r.movement||'arr';
  const legacyArr=!r.arr&&!r.dep&&r.start?new Date(r.start):null;
  if((m==='arr'||m==='both')&&(r.arr||legacyArr))out.push({k:'arr',label:'Arrival',short:'ARR',t:r.arr?new Date(r.arr):legacyArr});
  if((m==='dep'||m==='both')&&r.dep)out.push({k:'dep',label:'Departure',short:'DEP',t:new Date(r.dep)});
  if(!out.length&&legacyArr)out.push({k:'arr',label:'Arrival',short:'ARR',t:legacyArr});
  return out.sort((a,b)=>a.t-b.t);
}
const firstT=r=>{const m=moves(r);return m.length?m[0].t:null;};
const lastT=r=>{const m=moves(r);return m.length?m[m.length-1].t:null;};
const hasTimes=r=>moves(r).length>0;
/* where a moment sits against published (local) hours */
function hoursRel(d){
  const p=lon(d),wd=DOW.indexOf(p.weekday),h=(S('hours')||{})[String(wd)];
  if(!h)return null;
  if(h.closed)return {out:true,txt:'airport normally closed on '+DAYNAME[wd]+'s'};
  if(!(h.open&&h.close))return null;
  const m=(+p.hour)*60+(+p.minute),o=hm(h.open),c=hm(h.close);
  if(m>c)return {out:true,mins:m-c,txt:fmtDur((m-c)*60000)+' after published close ('+h.close.replace(':','')+'L)'};
  if(m<o)return {out:true,mins:o-m,txt:fmtDur((o-m)*60000)+' before published opening ('+h.open.replace(':','')+'L)'};
  return {out:false,txt:'within published hours'};
}
function hoursSummary(r){
  const rels=moves(r).map(m=>hoursRel(m.t)).filter(Boolean);
  if(!rels.length)return null;
  const out=rels.filter(x=>x.out);
  if(!out.length)return {short:'Within published hours',out:false};
  const mx=out.filter(x=>x.mins).sort((a,b)=>b.mins-a.mins)[0];
  return {short:mx?'+'+fmtDur(mx.mins*60000)+' outside hours':'Closed day',out:true};
}

/* ===== derived status ===== */
const req=r=>r.required||[];
const stateOf=(r,d)=>{const c=r.conf&&r.conf[d];const s=(c&&c.state)||'pending';return LEGACY[s]||s;};
function statusOf(r){
  if(r.status==='withdrawn')return {key:'cancelled',label:'Cancelled',stage:3};
  if(r.closeout)return r.closeout.outcome==='notused'?{key:'closed',label:'Closed: did not operate',stage:4}:{key:'closed',label:'Closed: operated',stage:4};
  if(r.decision)return r.decision.outcome==='confirmed'?{key:'confirmed',label:'Confirmed to operator',stage:3}:{key:'rejected',label:'Rejected',stage:3};
  const rq=req(r),un=rq.filter(d=>stateOf(r,d)==='unavailable');
  if(un.length)return {key:'blocked',label:'Cannot accommodate: '+un.map(d=>dept(d).short).join(', '),stage:2};
  const pend=rq.filter(d=>stateOf(r,d)==='pending');
  if(pend.length)return {key:'checking',label:'Checking: '+pend.map(d=>dept(d).short).join(', '),stage:1};
  return {key:'ready',label:'Ready to confirm',stage:2};
}
const isPast=r=>{const t=lastT(r);return !!t&&t.getTime()<Date.now();};
const pendingFor=(r,d)=>req(r).includes(d)&&stateOf(r,d)==='pending';
const isConfirmed=r=>statusOf(r).key==='confirmed';
const needsDecision=r=>{const k=statusOf(r).key;return k==='ready'||k==='blocked';};
const isOpen=r=>{const k=statusOf(r).key;return k==='checking'||k==='ready'||k==='blocked';};
const needsCloseout=r=>isConfirmed(r)&&isPast(r);
const closeoutOverdue=r=>needsCloseout(r)&&Date.now()>lastT(r).getTime()+(+S('closeoutDueH')||0)*36e5;
const shortNotice=r=>r.createdAt&&hasTimes(r)&&(firstT(r).getTime()-new Date(r.createdAt).getTime())<(+S('shortNoticeH')||0)*36e5;
const repliedCount=r=>req(r).filter(d=>stateOf(r,d)!=='pending').length;
function respondBy(r){
  const w=+S('respondWithinH')||0,b=+S('respondBeforeStartH')||0;if(!w&&!b)return null;
  const c=[];if(w&&r.createdAt)c.push(new Date(r.createdAt).getTime()+w*36e5);if(b&&hasTimes(r))c.push(firstT(r).getTime()-b*36e5);
  return c.length?Math.min.apply(null,c):null;
}
function overdue(r){const t=respondBy(r);return !!t&&statusOf(r).key==='checking'&&!isPast(r)&&Date.now()>t;}
function liveReq(r){const k=statusOf(r).key;return k!=='cancelled'&&k!=='rejected'&&!(r.closeout&&r.closeout.outcome==='notused');}
function sameDay(r){
  const days=new Set(moves(r).map(m=>isoDate(m.t)));if(!days.size)return [];
  return requests.filter(x=>x.id!==r.id&&hasTimes(x)&&liveReq(x)&&moves(x).some(m=>days.has(isoDate(m.t))));
}
function flags(r){
  const f=[],s=statusOf(r).key;
  if(s==='cancelled'||s==='rejected'||!hasTimes(r))return f;
  if(needsCloseout(r)){f.push(closeoutOverdue(r)?['urgent','Close-out overdue']:['info','Needs close-out']);return f;}
  if(isPast(r)||s==='closed')return f;
  const now=Date.now(),st=firstT(r).getTime();
  if(s!=='confirmed'&&st-now<(+S('urgentH')||0)*36e5)f.push(['urgent',(st>now?'Movement in '+fmtDur(st-now):'Movement due')+', not confirmed']);
  if(overdue(r))f.push(['urgent','Replies overdue']);
  if(shortNotice(r)&&isOpen(r))f.push(['info','Short notice']);
  const sd=sameDay(r);if(sd.length)f.push(['info','Same day as '+sd.map(x=>x.ref||x.id).join(', ')]);
  return f;
}
const activeReqs=()=>requests.filter(r=>hasTimes(r)&&!isPast(r));
const checkCount=d=>activeReqs().filter(r=>isOpen(r)&&!r.decision&&pendingFor(r,d)).length;
const decideCount=d=>activeReqs().filter(r=>r.reqDept===d&&needsDecision(r)).length;
const overdueCount=d=>requests.filter(r=>hasTimes(r)&&overdue(r)&&pendingFor(r,d)).length;
function nm(id){if(!id)return 'Someone';if(id===me.id)return me.name?me.name+' (you)':'You';return names[id]||'Someone';}
function moveLine(m){return '<span class="mv"><span class="mvk">'+m.short+'</span><span class="z">'+uT(m.t)+'</span><span class="l">'+lT(m.t)+'</span></span>';}

function downloader(){return {save:({filename,data})=>{try{const b=new Blob([data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);return Promise.resolve();}catch(e){return Promise.reject(e);}}};}
function makeFireDb(){
  const F=fb.F,fs=fb.fs;
  const snapDoc=x=>({id:x.id,exists:x.exists(),data:()=>x.data()});
  const wrap=r=>({id:r.id,set:d=>F.setDoc(r,d),update:d=>F.setDoc(r,d,{merge:true}),delete:()=>F.deleteDoc(r),onSnapshot:(n,e)=>F.onSnapshot(r,x=>n(snapDoc(x)),e)});
  return {doc:p=>wrap(F.doc(fs,p)),collection:c=>({doc:id=>wrap(F.doc(fs,c,id)),onSnapshot:(n,e)=>F.onSnapshot(F.collection(fs,c),x=>n({docs:x.docs.map(snapDoc)}),e),since:(field,val)=>({onSnapshot:(n,e)=>F.onSnapshot(F.query(F.collection(fs,c),F.where(field,'>=',val)),x=>n({docs:x.docs.map(snapDoc)}),e)})})};
}
async function init(){
  dl=downloader();
  if(!CONFIGURED){
    localMode=true;db=makeLocalDb();me={id:'demo',name:'Demo user',email:'demo@'+DOMAIN};canAdmin=true;
    await db.doc('users/demo').set({name:'Demo user',email:me.email,depts:DEPTS.map(d=>d.id),admin:true,createdAt:new Date().toISOString()});
    showApp();startData();return;
  }
  gate('loading');
  try{
    const m=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
    const app=m[0].initializeApp(FB);
    fb={U:m[1],F:m[2],auth:m[1].getAuth(app),fs:m[2].getFirestore(app)};
  }catch(e){console.error(e);gate('error','The portal could not load. Check your internet connection, then reload the page.');return;}
  db=makeFireDb();
  fb.U.onAuthStateChanged(fb.auth,u=>{authUser=u;stopData();if(!u){gate('signin');return;}checkUser();});
}
async function checkUser(){
  stopData();
  const u=authUser;if(!u)return;
  const email=String(u.email||'').toLowerCase();
  if(!email.endsWith('@'+DOMAIN)){gate('domain');return;}
  if(!u.emailVerified){gate('verify');return;}
  try{await u.getIdToken(true);}catch(e){}
  unsubs.push(fb.F.onSnapshot(fb.F.doc(fb.fs,'users',u.uid),x=>{
    if(!x.exists()){gate('profile');return;}
    const p=x.data();me={id:u.uid,name:p.name||'',email};canAdmin=OWNERS.includes(email)||p.admin===true;
    if(!started){showApp();startData();}else render();
  },err=>{console.error(err);gate('error','Your profile could not be loaded ('+(err.code||'error')+'). Check that the Firestore security rules have been published.');}));
}
function startData(){
  started=true;
  const rc=db.collection('requests'),cutoff=new Date(Date.now()-365*864e5).toISOString();
  unsubs.push((rc.since?rc.since('createdAt',cutoff):rc).onSnapshot(x=>{requests=x.docs.map(d=>Object.assign({id:d.id},d.data()));loaded=true;render();refreshOpen();},err=>{console.error(err);loaded=true;toast('Live updates stopped. Reload the page to reconnect.',true);render();}));
  unsubs.push(db.doc('config/settings').onSnapshot(x=>{settingsExists=x.exists;settings=Object.assign({},DEFAULTS,x.exists?x.data():{});render();refreshOpen();},err=>console.error(err)));
  unsubs.push(db.collection('users').onSnapshot(x=>{
    users={};x.docs.forEach(d=>{users[d.id]=d.data();});
    roster={members:{}};
    Object.keys(users).forEach(k=>{roster.members[k]=users[k].depts||[];names[k]=users[k].name||users[k].email||'';});
    const mine=users[me.id];
    if(mine){me.name=mine.name||me.name;canAdmin=localMode||OWNERS.includes(String(me.email||'').toLowerCase())||mine.admin===true;}
    render();refreshOpen();
  },err=>console.error(err)));
}
function stopData(){unsubs.forEach(f=>{try{f();}catch(e){}});unsubs=[];started=false;requests=[];loaded=false;}
function showApp(){$('#gate').hidden=true;$('#app').hidden=false;render();}
function resolveNames(){}

const GOOGLE_MSG={'auth/invalid-credential':'Email or password not recognised.','auth/wrong-password':'Email or password not recognised.','auth/user-not-found':'Email or password not recognised.','auth/invalid-email':'Check the email address.','auth/email-already-in-use':'An account already exists for this email. Sign in instead.','auth/weak-password':'Use a password of at least 8 characters.','auth/too-many-requests':'Too many attempts. Wait a few minutes, then try again.','auth/network-request-failed':'No connection. Check your internet and try again.'};
const authMsg=x=>GOOGLE_MSG[x&&x.code]||('Something went wrong'+(x&&x.code?' ('+x.code+')':'')+'. Try again.');
function gate(state,msg){
  $('#app').hidden=true;const g=$('#gate');g.hidden=false;
  const logo=$('.logo-tile img').getAttribute('src');let body='';
  if(state==='loading')body='<p class="g-lead">Loading\u2026</p>';

    body='<h2>'+(c?'Create your account':'Sign in')+'</h2><p class="g-lead">'+(c?'Use your @'+DOMAIN+' email address. We\u2019ll email you a link to confirm it\u2019s yours.':'Use your @'+DOMAIN+' email address and portal password.')+'</p>'+
      '<form id="gform" novalidate data-mode="'+state+'">'+(c?'<label>Your name<input type="text" name="gname" autocomplete="name" placeholder="As colleagues know you"></label>':'')+
      '<label>Email<input type="email" name="gemail" autocomplete="email" placeholder="firstname.lastname@'+DOMAIN+'"></label>'+
      '<label>Password<input type="password" name="gpass" autocomplete="'+(c?'new-password':'current-password')+'"'+(c?' placeholder="At least 8 characters"':'')+'></label>'+
      '<p class="err" id="gerr" role="alert"></p><p class="g-ok" id="gok" role="status"></p><button class="btn primary g-main" type="submit">'+(c?'Create account':'Sign in')+'</button></form>'+
      '<div class="g-alt">'+(c?'Already have an account? <button class="linkish" data-act="g-signin">Sign in</button>':'New here? <button class="linkish" data-act="g-create">Create an account</button><span class="g-sep">\u00b7</span><button class="linkish" data-act="g-reset">Forgot password</button>')+'</div>';
  }else if(state==='verify'){
    body='<h2>Confirm your email</h2><p class="g-lead">We\u2019ve sent a link to <b>'+esc(authUser&&authUser.email)+'</b>. Open it, then come back here. If it hasn\u2019t arrived within a few minutes, check your junk folder.</p><p class="err" id="gerr" role="alert"></p><p class="g-ok" id="gok" role="status"></p>'+
      '<button class="btn primary g-main" data-act="g-verified">I\u2019ve confirmed it, continue</button><div class="g-alt"><button class="linkish" data-act="g-resend">Send the link again</button><span class="g-sep">\u00b7</span><button class="linkish" data-act="g-signout">Use a different account</button></div>';
  }else if(state==='profile'){
    body='<h2>One last thing</h2><p class="g-lead">What name should colleagues see against your replies?</p><form id="gform" data-mode="profile" novalidate><label>Your name<input type="text" name="gname" autocomplete="name" value="'+esc(pendingName)+'"></label><p class="err" id="gerr" role="alert"></p><button class="btn primary g-main" type="submit">Continue</button></form>';
  }else if(state==='domain'){
    body='<h2>Cranfield accounts only</h2><p class="g-lead">'+esc(authUser&&authUser.email)+' isn\u2019t a @'+DOMAIN+' address, so it can\u2019t use this portal.</p><button class="btn primary g-main" data-act="g-signout">Sign out</button>';
  }else{
    body='<h2>Something went wrong</h2><p class="g-lead">'+esc(msg||'')+'</p><button class="btn primary g-main" data-act="g-reload">Reload</button>';
  }
  g.innerHTML='<div class="g-card"><div class="g-brand"><img src="'+logo+'" alt="London Cranfield Airport"><div><div class="brand-sub">Operations portal</div><div class="g-title">Extension of Hours</div></div></div><div class="g-body">'+body+'</div></div>';
  const f=$('#gform');if(f)f.addEventListener('submit',gateSubmit);
  const first=g.querySelector('input');if(first)first.focus();
}
async function gateSubmit(e){
  e.preventDefault();
  const f=e.target,mode=f.dataset.mode,err=$('#gerr'),btn=f.querySelector('button[type=submit]');
  const v=n=>f.elements[n]?f.elements[n].value.trim():'';
  err.textContent='';
  try{
    if(mode==='profile'){
      const name=v('gname');if(name.length<2){err.textContent='Enter your name.';return;}
      btn.disabled=true;
      await fb.F.setDoc(fb.F.doc(fb.fs,'users',authUser.uid),{email:authUser.email,name,depts:[],admin:false,createdAt:new Date().toISOString()});
      return;
    }
    const email=v('gemail').toLowerCase(),pass=f.elements.gpass.value;
    if(!email.endsWith('@'+DOMAIN)){err.textContent='Use your @'+DOMAIN+' email address.';return;}
    if(mode==='create'){
      const name=v('gname');
      if(name.length<2){err.textContent='Enter your name.';return;}
      if(pass.length<8){err.textContent='Use a password of at least 8 characters.';return;}
      pendingName=name;btn.disabled=true;
      const c=await fb.U.createUserWithEmailAndPassword(fb.auth,email,pass);
      await fb.U.sendEmailVerification(c.user);
      return;
    }
    if(!pass){err.textContent='Enter your password.';return;}
    btn.disabled=true;
    await fb.U.signInWithEmailAndPassword(fb.auth,email,pass);
  }catch(x){if(btn)btn.disabled=false;err.textContent=authMsg(x);}
}
async function gateAction(a){
  const err=$('#gerr'),ok=$('#gok');if(err)err.textContent='';if(ok)ok.textContent='';
  try{
    if(a==='g-signin')gate('signin');
    else if(a==='g-create')gate('create');
    else if(a==='g-reload')location.reload();
    else if(a==='g-signout')await fb.U.signOut(fb.auth);
    else if(a==='g-reset'){
      const em=($('#gform [name="gemail"]')||{}).value||'';
      if(!em.trim().toLowerCase().endsWith('@'+DOMAIN)){err.textContent='Enter your @'+DOMAIN+' email address above first.';return;}
      await fb.U.sendPasswordResetEmail(fb.auth,em.trim().toLowerCase());
      ok.textContent='If that address has an account, a password reset link is on its way.';
    }else if(a==='g-resend'){await fb.U.sendEmailVerification(authUser);ok.textContent='Sent. Check your inbox and junk folder.';}
    else if(a==='g-verified'){
      await authUser.reload();
      if(fb.auth.currentUser&&fb.auth.currentUser.emailVerified){authUser=fb.auth.currentUser;await authUser.getIdToken(true);checkUser();}
      else err.textContent='Not confirmed yet. Open the link in the email first, then try again.';
    }
  }catch(x){if(err)err.textContent=authMsg(x);}
}

/* ===== writes ===== */
let chain=Promise.resolve();
function save(fn,ok){
  chain=chain.then(fn).then(()=>{if(ok)toast(ok);}).catch(e=>{console.error(e);const c=e&&e.code;
    toast(c==='permission-denied'?"You don't have permission to do that. If your department isn't set up yet, ask a portal admin.":c==='invalid_argument'?"You don't have permission to change this. Ask the portal owner for the right access.":c==='quota_exceeded'?'The portal is full. Ask the portal owner to clear old requests.':"Couldn't save that. Try again.",true);});
  return chain;
}
const ref=id=>db.collection('requests').doc(id);
function logEntry(o){const e=Object.assign({by:me.id||null,dept:ui.dept||null,at:new Date().toISOString()},o);const x={};x[lid()]=e;return x;}
function writeConfig(which,patch,ok){const ex=which==='settings'?settingsExists:rosterExists;return save(()=>{const r=db.doc('config/'+which);return ex?r.update(patch):r.set(patch);},ok);}
function doRespond(id,d,state,text,offer,mode){
  const at=new Date().toISOString(),c={};
  c[d]={state,cover:state==='available'?text:'',note:state==='unavailable'?text:'',offer:state==='unavailable'?(offer||''):'',at:state==='pending'?null:at,by:state==='pending'?null:(me.id||null),override:mode==='override'};
  save(()=>ref(id).update({conf:c,updatedAt:at,log:logEntry({t:'response',dept:d,state,text:text||'',offer:state==='unavailable'?(offer||''):'',override:mode==='override'})}),state==='pending'?'Set back to checking':'Reply saved');
}
function doDecide(id,outcome,note,mode){
  const r=requests.find(x=>x.id===id);if(!r)return;
  const at=new Date().toISOString(),decision={outcome,note:note||'',by:me.id||null,at,override:mode==='override'};
  save(()=>ref(id).update({decision,updatedAt:at,log:logEntry({t:'decision',dept:r.reqDept,outcome,text:note||'',override:mode==='override'})}),outcome==='confirmed'?'Confirmed to operator':'Request rejected');
}
const doReopenDecision=id=>save(()=>ref(id).update({decision:null,updatedAt:new Date().toISOString(),log:logEntry({t:'reopened-decision'})}),'Decision reopened');
const doNote=(id,text)=>save(()=>ref(id).update({updatedAt:new Date().toISOString(),log:logEntry({t:'note',text})}),'Update added');
const doCancel=(id,on)=>save(()=>ref(id).update({status:on?'withdrawn':'active',updatedAt:new Date().toISOString(),log:logEntry({t:on?'withdrawn':'reinstated'})}),on?'Request cancelled':'Request reinstated');
function doDelete(id){closeDetail();save(()=>ref(id).delete(),'Request deleted');}
const doReopen=id=>save(()=>ref(id).update({closeout:null,updatedAt:new Date().toISOString(),log:logEntry({t:'reopened'})}),'Close-out reopened');

/* ===== preserve edits across re-renders ===== */
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('input,textarea,select'))e.target.dataset.dirty='1';},true);
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('input,textarea,select'))e.target.dataset.dirty='1';},true);
function preserve(root,fn){
  const saved=[];
  root.querySelectorAll('[data-dirty]').forEach(el=>{const k=el.name||el.id;if(k)saved.push({k,v:el.value,c:el.checked,t:el.type});});
  const ae=document.activeElement,ak=ae&&root.contains(ae)?(ae.name||ae.id):null;let ss=null,se=null;
  try{if(ak){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  const sc=root.querySelector('.dlg-body');const st=sc?sc.scrollTop:0;
  fn();
  saved.forEach(s=>{
    const sel=s.t==='checkbox'||s.t==='radio'?'[name="'+s.k+'"][value="'+CSS.escape(s.v)+'"]':'[name="'+s.k+'"],#'+CSS.escape(s.k);
    const el=root.querySelector(sel);if(!el)return;
    if(s.t==='checkbox'||s.t==='radio')el.checked=s.c;else el.value=s.v;
    el.dataset.dirty='1';
  });
  if(ak){const el=root.querySelector('[name="'+ak+'"]')||root.querySelector('#'+CSS.escape(ak));if(el){el.focus();try{if(ss!=null)el.setSelectionRange(ss,se);}catch(e){}}}
  const nb=root.querySelector('.dlg-body');if(nb)nb.scrollTop=st;
}

/* ===== board ===== */
function matchQ(r,q){
  if(!q)return true;q=q.toLowerCase();
  const hay=[r.ref,opName(r),r.reg,r.acType,fcat(r),MOVES[r.movement],r.details,r.reason,r.contact,dept(r.reqDept).name,r.closeout&&r.closeout.note,r.decision&&r.decision.note,nm(r.reqBy)]
    .concat(Object.values(r.log||{}).map(l=>l.text||'')).concat(Object.values(r.conf||{}).map(c=>c?[c.cover,c.note,c.offer].join(' '):'')).join(' ').toLowerCase();
  return hay.includes(q);
}
function visible(){
  const list=requests.filter(r=>{
    if(!hasTimes(r)||!matchQ(r,ui.q))return false;
    const s=statusOf(r).key,f=ui.filter;
    if(isPast(r)&&!ui.past&&!ui.q&&!needsCloseout(r)&&f!=='done'&&f!=='closed')return false;
    if(f==='checking')return s==='checking';
    if(f==='mine')return isOpen(r)&&(myTeams().some(d=>pendingFor(r,d))||(myTeams().includes(r.reqDept)&&needsDecision(r)));
    if(f==='team')return isOpen(r)&&!!ui.dept&&(pendingFor(r,ui.dept)||(r.reqDept===ui.dept&&needsDecision(r)));
    if(f==='decide')return needsDecision(r);
    if(f==='confirmed')return s==='confirmed';
    if(f==='closeout')return needsCloseout(r);
    if(f==='done')return s==='closed';
    if(f==='closed')return s==='rejected'||s==='cancelled';
    return true;
  });
  const needs=list.filter(needsCloseout).sort((a,b)=>lastT(a)-lastT(b));
  const up=list.filter(r=>!isPast(r)).sort((a,b)=>firstT(a)-firstT(b));
  const ps=list.filter(r=>isPast(r)&&!needsCloseout(r)).sort((a,b)=>firstT(b)-firstT(a));
  return needs.concat(up,ps);
}
function stepsHTML(r,compact){
  const st=statusOf(r),n=req(r).length,rep=repliedCount(r);
  const s2=rep===n?'done':st.key==='blocked'?'bad':'now',s3=st.stage>=3?(st.key==='rejected'||st.key==='cancelled'?'bad':'done'):(st.stage===2?'now':'todo');
  const l3=st.key==='confirmed'||st.key==='closed'?'Confirmed':st.key==='rejected'?'Rejected':st.key==='cancelled'?'Cancelled':'Decision';
  const items=[['Requested','done'],['Departments '+rep+'/'+n,s2],[l3,s3]];
  if(compact)return '<span class="prog" aria-label="'+esc(rep+' of '+n+' departments replied')+'">'+items.map(i=>'<i class="'+i[1]+'"></i>').join('')+'</span>';
  return '<ol class="steps" aria-label="Progress">'+items.map(i=>'<li class="'+i[1]+'"><span class="sd"></span>'+esc(i[0])+'</li>').join('')+'</ol>';
}
function stripHTML(r){
  const st=statusOf(r),mv=moves(r),rd=dept(r.reqDept),hs=hoursSummary(r);
  const deps=DEPTS.map(d=>{
    if(!req(r).includes(d.id))return '<span class="dp st-none"><span class="dot"></span><span class="dn">'+d.short+'</span><span class="dw">Not needed</span></span>';
    const k=stateOf(r,d.id),c=(r.conf&&r.conf[d.id])||{};
    const w=k==='available'?(c.cover||c.note||'Can do'):k==='unavailable'?(c.offer?'Offers '+c.offer:'Cannot'):'Checking';
    return '<span class="dp st-'+k+'" title="'+esc(d.name+': '+STATE[k].full+(c.cover?' ('+c.cover+')':''))+'"><span class="dot"></span><span class="dn">'+d.short+'</span><span class="dw">'+esc(trunc(w,22))+'</span></span>';
  }).join('');
  const fl=flags(r).map(f=>'<span class="flag '+f[0]+'">'+esc(f[1])+'</span>').join('');
  const cls=(isPast(r)?' past':'')+(st.key==='cancelled'||st.key==='rejected'?' dim':'');
  return '<div class="rq k-'+st.key+cls+'" role="button" tabindex="0" data-act="open" data-id="'+esc(r.id)+'">'+
    '<div class="rq-time"><div class="rq-date">'+uDate(mv[0].t)+'</div>'+mv.map(m=>'<div class="rq-mv">'+moveLine(m)+'</div>').join('')+(hs?'<div class="rq-hrs'+(hs.out?' out':'')+'">'+esc(hs.short)+'</div>':'')+'</div>'+
    '<div class="rq-main"><div class="rq-title">'+esc(opName(r))+(r.reg?'<span class="reg">'+esc(r.reg)+'</span>':'')+'</div>'+
      '<div class="rq-sub">'+esc([r.acType,fcat(r),MOVES[r.movement]].filter(Boolean).join(' \u00b7 '))+'</div>'+
      ((r.details||r.reason)?'<div class="rq-det">'+esc(r.details||r.reason)+'</div>':'')+
      '<div class="rq-meta"><span>'+esc(r.ref||r.id)+'</span><span>Raised by '+esc(rd.short)+'</span>'+fl+'</div></div>'+
    '<div class="rq-deps">'+deps+'</div>'+
    '<div class="rq-status"><span class="tag '+st.key+'">'+esc(st.label)+'</span>'+stepsHTML(r,true)+'</div></div>';
}
function renderBoard(){
  const m=$('#main');
  if(!loaded){m.innerHTML='<div class="empty">Loading requests\u2026</div>';return;}
  if(!requests.length){m.innerHTML='<div class="empty"><h2>No extension requests yet</h2><p>When an operator asks to arrive or depart outside published hours, Airport Ops or Handling raise it here. Each department says whether it can accommodate the movement and who is covering, then the requester confirms or rejects.</p>'+(canRaise()?'<button class="btn primary" data-act="new">New request</button>':'')+'</div>';return;}
  const list=visible();
  if(!list.length){m.innerHTML='<div class="empty"><h2>Nothing matches</h2><p>Change the filter, clear the search or show past requests.</p></div>';return;}
  m.innerHTML='<div class="rqs">'+list.map(stripHTML).join('')+'</div>';
}

/* ===== schedule (UTC days) ===== */
function renderWeek(){
  const m=$('#main');
  if(!loaded){m.innerHTML='<div class="empty">Loading requests\u2026</div>';return;}
  const ws=ui.week,we=new Date(ws);we.setUTCDate(we.getUTCDate()+6);
  const title=ws.getUTCDate()+' '+MON[ws.getUTCMonth()]+' \u2013 '+we.getUTCDate()+' '+MON[we.getUTCMonth()]+' '+we.getUTCFullYear();
  const today=isoDate(new Date());
  const evs=[];requests.filter(r=>hasTimes(r)&&liveReq(r)).forEach(r=>moves(r).forEach(mv=>evs.push({r,mv})));
  let cols='';
  for(let i=0;i<7;i++){
    const D=new Date(ws);D.setUTCDate(D.getUTCDate()+i);const key=isoDate(D);
    const day=evs.filter(e=>isoDate(e.mv.t)===key).sort((a,b)=>a.mv.t-b.mv.t).map(e=>{
      const st=statusOf(e.r);
      return '<button class="ev" data-act="open" data-id="'+esc(e.r.id)+'"><span class="band b-'+st.key+'"></span><span class="in"><div class="t">'+moveLine(e.mv)+'</div><div class="k">'+esc(trunc(opName(e.r)+(e.r.reg?' '+e.r.reg:''),40))+'</div><div class="k '+st.key+'">'+esc(st.label)+'</div></span></button>';
    }).join('');
    const h=(S('hours')||{})[String(D.getUTCDay())];
    const ht=h?(h.closed?'Closed':(h.open&&h.close?'Open '+h.open.replace(':','')+'\u2013'+h.close.replace(':','')+'L':'')):'';
    cols+='<div class="day'+(key===today?' today':'')+'"><h3>'+uDate(D)+'</h3>'+(ht?'<div class="hrs">'+esc(ht)+'</div>':'')+(day||'<div class="none">No movements</div>')+'</div>';
  }
  m.innerHTML='<div class="wk-nav"><button class="btn sm" data-act="wk" data-d="-1">\u2039 Previous</button><button class="btn sm" data-act="wk" data-d="0">This week</button><button class="btn sm" data-act="wk" data-d="1">Next \u203A</button><h2>'+title+'</h2></div>'+
    '<div class="week">'+cols+'</div><p class="cap">Days are UTC dates. Rejected, cancelled and non-operating requests are not shown.</p>';
}

/* ===== history ===== */
function fmtVal(f,v){
  if(f==='arr'||f==='dep')return v?uDT(new Date(v)):'none';
  if(f==='movement')return MOVES[v]||'blank';
  if(f==='fireCat')return v?'Cat '+v:'not set';
  if(f==='reqDept')return dept(v).name;
  if(f==='required')return (v||[]).map(d=>dept(d).short).join(', ')||'none';
  return v?'\u201C'+trunc(v,60)+'\u201D':'blank';
}
const RESP_WORD={available:'can accommodate',unavailable:'cannot accommodate',pending:'back to checking',confirmed:'can accommodate',conditional:'can accommodate',declined:'cannot accommodate'};
function logText(l){
  switch(l.t){
    case 'created':return 'Raised the request';
    case 'response':{const ok=(LEGACY[l.state]||l.state)==='available';return dept(l.dept).short+' '+(RESP_WORD[l.state]||l.state)+(l.override?' (on their behalf)':'')+(l.text?(ok?'. Covering: ':'. ')+l.text:'')+(l.offer?'. Can offer: '+l.offer:'');}
    case 'decision':return (l.outcome==='confirmed'?'Confirmed to the operator':'Rejected the request')+(l.override?' (on behalf of '+dept(l.dept).short+')':'')+(l.text?'. '+l.text:'');
    case 'reopened-decision':return 'Reopened the decision';
    case 'edited':{const c=(l.changes||[]).map(x=>(FIELDS[x.f]||x.f)+' '+fmtVal(x.f,x.from)+' \u2192 '+fmtVal(x.f,x.to)).join('; ');return 'Edited: '+(c||'details')+(l.reset?'. Department replies and decision reset':'');}
    case 'withdrawn':return 'Cancelled the request';
    case 'reinstated':return 'Reinstated the request';
    case 'closeout':{if(l.outcome==='notused')return 'Closed out: did not operate'+(l.text?'. '+l.text:'');const a=[l.actualArr?'arrived '+uT(new Date(l.actualArr)):'',l.actualDep?'departed '+uT(new Date(l.actualDep)):''].filter(Boolean).join(', ');return 'Closed out: operated'+(a?', '+a:'')+(l.text?'. '+l.text:'');}
    case 'reopened':return 'Reopened the close-out';
    case 'alert':return 'Prepared an email: '+(l.text||'');
    case 'roster':return (l.action==='add'?'Added ':'Removed ')+nm(l.uid)+(l.action==='add'?' to ':' from ')+dept(l.team).name;
    case 'settings':return l.text||'Changed settings';
    default:return l.text||'';
  }
}
function allLogs(){
  const out=[];
  requests.forEach(r=>Object.values(r.log||{}).forEach(l=>out.push(Object.assign({ref:r.ref||r.id,rid:r.id},l))));
  [settings.log,roster.log].forEach(L=>Object.values(L||{}).forEach(l=>out.push(Object.assign({ref:'Admin',rid:null},l))));
  return out.sort((a,b)=>(b.at||'')<(a.at||'')?-1:(b.at||'')>(a.at||'')?1:0);
}
function histRows(){const q=ui.hq.toLowerCase();return allLogs().filter(l=>!q||[l.ref,nm(l.by),l.dept?dept(l.dept).name:'',logText(l)].join(' ').toLowerCase().includes(q));}
function renderHistory(){
  const m=$('#main');
  if(!loaded){m.innerHTML='<div class="empty">Loading history\u2026</div>';return;}
  const rows=histRows();
  if(!rows.length){m.innerHTML='<div class="empty"><h2>No history yet</h2><p>Every request, department reply, decision, edit, close-out and admin change is recorded here.</p></div>';return;}
  const shown=rows.slice(0,ui.histN);
  m.innerHTML='<div class="tblwrap"><table class="tbl"><thead><tr><th scope="col">When (UTC)</th><th scope="col">Who</th><th scope="col">Request</th><th scope="col">What happened</th></tr></thead><tbody>'+
    shown.map(l=>'<tr><td class="when">'+(l.at?esc(uDate(new Date(l.at))+' '+uT(new Date(l.at))):'')+'</td><td>'+esc(nm(l.by))+(l.dept?'<br><span class="hint" style="margin:0">'+esc(dept(l.dept).name)+'</span>':'')+'</td><td>'+(l.rid&&requests.some(r=>r.id===l.rid)?'<button class="linkish" data-act="open" data-id="'+esc(l.rid)+'">'+esc(l.ref)+'</button>':esc(l.ref))+'</td><td>'+esc(logText(l))+'</td></tr>').join('')+
    '</tbody></table></div>'+(rows.length>shown.length?'<div class="more"><button class="btn" data-act="more">Show more ('+(rows.length-shown.length)+' older)</button></div>':'');
}

      num('shortNoticeH','Short notice (hours)','Flag requests raised less than this long before the first movement.')+

    ul.map(u=>{const own=OWNERS.includes(String(u.email||'').toLowerCase()),nm2=u.name||u.email||'Unnamed';

function syncForm(){
  const el=$('#f').elements,m=el.movement.value;
  $('#row-arr').style.display=m==='dep'?'none':'';
  $('#row-dep').style.display=m==='arr'?'none':'';
  const fm=formMoves();

    h.textContent='= '+lDT(d)+(hr?' \u00b7 '+hr.txt:'');h.className='hint mvhint'+(hr&&hr.out?' out':'');
  });
  const tmp={id:ui.editing||'__new',movement:fm.movement,arr:fm.arr,dep:fm.dep};

}
function submitForm(ev){
  ev.preventDefault();
  const f=$('#f'),el=f.elements,err=$('#ferr'),fm=formMoves();
  const data={operator:el.operator.value.trim(),reg:el.reg.value.trim().toUpperCase(),acType:el.acType.value.trim().toUpperCase(),fireCat:el.fireCat.value,movement:fm.movement,arr:fm.arr,dep:fm.dep,details:el.details.value.trim(),contact:el.contact.value.trim(),reqDept:el.reqDept.value,required:[...f.querySelectorAll('input[name="req"]:checked')].map(c=>c.value)};
  if(!data.operator){err.textContent='Enter the operator.';el.operator.focus();return;}
  if(data.movement!=='dep'&&!data.arr){err.textContent='Enter the arrival date and UTC time, for example 2140.';el.arrTime.focus();return;}
  if(data.movement!=='arr'&&!data.dep){err.textContent='Enter the departure date and UTC time, for example 2230.';el.depTime.focus();return;}
  if(!data.required.length){err.textContent='Choose at least one department to check.';return;}
  const ts=[data.arr,data.dep].filter(Boolean).sort();data.first=ts[0];data.last=ts[ts.length-1];
  const at=new Date().toISOString(),id=ui.editing;
  $('#formdlg').close();
  if(!id){
    const rf=newRef();
    const doc=Object.assign({ref:rf,reqBy:me.id||null,conf:{},decision:null,status:'active',closeout:null,createdAt:at,updatedAt:at,log:logEntry({t:'created',dept:data.reqDept})},data);
    openDetail(rf);
    save(()=>ref(rf).set(doc),'Request sent to departments');
  }else{
    const old=requests.find(x=>x.id===id);if(!old)return;
    const ov=k=>k==='operator'?opName(old):k==='details'?(old.details||old.reason||''):k==='arr'?(old.arr||null):(old[k]||(k==='dep'?null:''));
    const changes=Object.keys(FIELDS).filter(k=>k==='required'?req(old).slice().sort().join()!==data.required.slice().sort().join():(ov(k)||'')!==(data[k]||'')).map(k=>({f:k,from:k==='required'?req(old):ov(k),to:data[k]}));
    if(!changes.length)return;
    const timeChanged=changes.some(c=>c.f==='arr'||c.f==='dep'||c.f==='movement');
    const catChanged=changes.some(c=>c.f==='fireCat');
    const conf={};let reset=false;
    data.required.forEach(d=>{const fresh=!req(old).includes(d);if(timeChanged||fresh||(catChanged&&d==='RFFS')){conf[d]={state:'pending',cover:'',note:'',at:null,by:null,override:false};if(timeChanged&&stateOf(old,d)!=='pending')reset=true;}});
    const patch=Object.assign({},data,{start:null,end:null,updatedAt:at,log:logEntry({t:'edited',changes,reset:reset||((timeChanged||catChanged)&&!!old.decision)})});
    if(Object.keys(conf).length)patch.conf=conf;
    if((timeChanged||catChanged)&&old.decision)patch.decision=null;
    save(()=>ref(id).update(patch),'Changes saved');
  }
}
