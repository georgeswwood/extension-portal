function openCloseout(id){
  const r=requests.find(x=>x.id===id);if(!r)return;ui.coId=id;
  const mv=moves(r);
  $('#cof').innerHTML='<div class="dlg-head"><div><div class="ref">'+esc(r.ref||r.id)+'</div><h2 id="c-title">Close out: '+esc(opName(r))+'</h2></div><button type="button" class="icon" data-act="close-co" aria-label="Close">\u2715</button></div>'+
   '<div class="dlg-body fields"><p class="hint" style="margin:0">Confirmed: '+esc(mv.map(m=>m.label+' '+uDate(m.t)+' '+uT(m.t)).join(', '))+'</p>'+
   '<fieldset class="seg"><legend>Did the movement operate?</legend><label><input type="radio" name="outcome" value="used" checked>Operated</label><label><input type="radio" name="outcome" value="notused">Did not operate</label></fieldset>'+
   '<div id="actrow" class="fields">'+mv.map(m=>{const p=splitISO(m.t.toISOString());return '<div class="row2"><label>Actual '+m.label.toLowerCase()+' date (UTC)<input type="date" name="a'+m.k+'Date" value="'+p[0]+'"></label><label>Actual '+m.label.toLowerCase()+' time (UTC)<input type="text" inputmode="numeric" maxlength="5" name="a'+m.k+'Time" value="'+p[1]+'"></label></div>';}).join('')+'</div>'+
   '<label>Notes (optional)<textarea name="conote" rows="3" placeholder="For example: landed 2212, all departments released 2240"></textarea></label><p class="err" id="coerr" role="alert"></p></div>'+
   '<div class="dlg-foot"><button type="button" class="btn" data-act="close-co">Cancel</button><button type="submit" class="btn primary">Save close-out</button></div>';
  syncCo();$('#codlg').showModal();
}
function syncCo(){const f=$('#cof');$('#actrow').style.display=f.elements.outcome.value==='used'?'':'none';}
function submitCo(ev){
  ev.preventDefault();
  const f=$('#cof'),el=f.elements,id=ui.coId,o=el.outcome.value,note=el.conote.value.trim(),r=requests.find(x=>x.id===id);if(!r)return;
  let aArr=null,aDep=null;
  if(o==='used'){
    for(const m of moves(r)){const v=mkISO(el['a'+m.k+'Date'].value,el['a'+m.k+'Time'].value);if(!v){$('#coerr').textContent='Enter the actual '+m.label.toLowerCase()+' time in UTC, for example 2212.';return;}if(m.k==='arr')aArr=v;else aDep=v;}
  }
  const at=new Date().toISOString(),co={outcome:o,actualArr:aArr,actualDep:aDep,note,by:me.id||null,at};
  $('#codlg').close();
  save(()=>ref(id).update({closeout:co,updatedAt:at,log:logEntry({t:'closeout',outcome:o,actualArr:aArr,actualDep:aDep,text:note})}),'Close-out saved');
}

/* ===== exports ===== */
const csvOf=rows=>'\ufeff'+rows.map(row=>row.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
function saveFile(name,data){dl.save({filename:name,data}).catch(e=>{if(e&&e.code!=='declined')toast("Couldn't export the file.",true);});}
const csvU=iso=>iso?iso.slice(0,10)+' '+iso.slice(11,16):'';
const csvL=iso=>iso?lDT(new Date(iso)):'';
function exportCSV(){
  const head=['Ref','Operator','Callsign or registration','Aircraft type','Required Fire Cat','Movement','Arrival UTC','Arrival local','Departure UTC','Departure local','Status','Raised by','Requesting department','Details','Operator contact','Raised at UTC','Decision','Decided by','Decision note','Outcome','Actual arrival UTC','Actual departure UTC'].concat(DEPTS.map(d=>d.name));
  const rows=requests.filter(hasTimes).sort((a,b)=>firstT(a)-firstT(b)).map(r=>{
    const c=r.closeout,dc=r.decision,mv=moves(r),A=mv.find(m=>m.k==='arr'),D=mv.find(m=>m.k==='dep');
    const ai=A?A.t.toISOString():'',di=D?D.t.toISOString():'';
    return [r.ref||r.id,opName(r),r.reg||'',r.acType||'',r.fireCat?'Cat '+r.fireCat:'',MOVES[r.movement]||'',csvU(ai),csvL(ai),csvU(di),csvL(di),statusOf(r).label,nm(r.reqBy).replace(' (you)',''),dept(r.reqDept).name,r.details||r.reason||'',r.contact||'',csvU(r.createdAt),
      dc?(dc.outcome==='confirmed'?'Confirmed':'Rejected'):'',dc?nm(dc.by).replace(' (you)',''):'',dc?dc.note:'',
      c?(c.outcome==='notused'?'Did not operate':'Operated'):'',csvU(c&&c.actualArr),csvU(c&&c.actualDep)]
      .concat(DEPTS.map(d=>{if(!req(r).includes(d.id))return 'Not needed';const x=(r.conf&&r.conf[d.id])||{},k=stateOf(r,d.id);return STATE[k].full+(x.override?' (on their behalf)':'')+(k==='available'&&(x.cover||x.note)?' - covering: '+(x.cover||x.note):'')+(k==='unavailable'&&x.note?' - '+x.note:'')+(k==='unavailable'&&x.offer?' - can offer: '+x.offer:'');}));
  });
  saveFile('extension-requests.csv',csvOf([head].concat(rows)));
}
function exportHistory(){saveFile('extension-history.csv',csvOf([['When (UTC)','Who','Department','Request','What happened']].concat(histRows().map(l=>[csvU(l.at),nm(l.by),l.dept?dept(l.dept).name:'',l.ref,logText(l)]))));}

/* ===== toast ===== */
let tt;
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className=bad?'err':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none';},bad?6500:2800);}

/* ===== events ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target===$('#detail'))closeDetail();else if(e.target===$('#formdlg'))$('#formdlg').close();else if(e.target===$('#codlg'))$('#codlg').close();return;}
  const a=t.dataset.act,id=t.dataset.id;
  if(a.startsWith('g-')){gateAction(a);return;}
  switch(a){
    case 'signout':if(fb)fb.U.signOut(fb.auth);break;
    case 'dept':ui.dept=t.dataset.dept;storeDept(ui.dept);if(rosterActive()){ui.filter='team';ui.tab='board';}render();refreshOpen();break;
    case 'tab':ui.tab=t.dataset.tab;render();break;
    case 'filter':ui.filter=t.dataset.filter;render();break;
    case 'open':openDetail(id);break;
    case 'new':openForm(null);break;
    case 'edit':closeDetail();openForm(id);break;
    case 'close':closeDetail();break;
    case 'close-form':$('#formdlg').close();break;
    case 'close-co':$('#codlg').close();break;
    case 'closeout':openCloseout(id);break;
    case 'reopen':doReopen(id);break;
    case 'reopen-decision':doReopenDecision(id);break;
    case 'wk':{const d=+t.dataset.d;if(d===0)ui.week=mondayUTC(new Date());else{const x=new Date(ui.week);x.setUTCDate(x.getUTCDate()+7*d);ui.week=x;}render();break;}
    case 'export':exportCSV();break;
    case 'export-hist':exportHistory();break;
    case 'more':ui.histN+=200;render();break;
    case 'respond':{
      const dd=t.dataset.dept,state=t.dataset.state,mode=t.dataset.mode,inp=$('#detail [name="resp-'+dd+'"]'),txt=inp?inp.value.trim():'',oi=$('#detail [name="offer-'+dd+'"]'),offer=oi?oi.value.trim():'';
      if(!txt&&state==='available'){toast('Say who is covering first.',true);if(inp)inp.focus();return;}
      if(!txt&&state==='unavailable'){toast('Add why it cannot be accommodated.',true);if(inp)inp.focus();return;}
      if(inp){inp.value='';delete inp.dataset.dirty;}if(oi){oi.value='';delete oi.dataset.dirty;}
      doRespond(ui.openId,dd,state,txt,offer,mode);break;
    }
    case 'decide':{
      const out=t.dataset.out,mode=t.dataset.mode,ta=$('#detail [name="decnote"]'),note=ta?ta.value.trim():'';
      if(!note&&(mode==='override'||out==='rejected')){toast(mode==='override'?'Add a reason for deciding on their behalf.':'Add the reason for rejecting.',true);if(ta)ta.focus();return;}
      if(ta){ta.value='';delete ta.dataset.dirty;}
      doDecide(ui.openId,out,note,mode);break;
    }
    case 'note':{const n=$('#detail [name="note"]'),v=n?n.value.trim():'';if(!v){if(n)n.focus();return;}n.value='';delete n.dataset.dirty;doNote(id,v);break;}
    case 'cancel':doCancel(id,true);break;
    case 'reinstate':doCancel(id,false);break;
    case 'delete':
      if(t.dataset.armed)doDelete(id);
      else{t.dataset.armed='1';t.textContent='Confirm delete';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='Delete';}},4000);}
      break;
    case 'roster-add':{const p=(ui.hits[t.dataset.team]||[]).find(x=>x.id===t.dataset.uid);if(p&&p.name)names[p.id]=p.name;const inp=$('#main [name="find-'+t.dataset.team+'"]');if(inp){inp.value='';delete inp.dataset.dirty;}rosterSet(t.dataset.uid,t.dataset.team,true);break;}
    case 'roster-rm':rosterSet(t.dataset.uid,t.dataset.team,false);break;
    case 'save-hours':saveHours();break;
    case 'save-rules':saveRules();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('rq')){e.preventDefault();openDetail(e.target.dataset.id);}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pastTg'){ui.past=t.checked;render();}
  else if(t.classList.contains('ud')){delete t.dataset.dirty;rosterSet(t.dataset.uid,t.dataset.dept,t.checked);}
  else if(t.classList.contains('ua')){delete t.dataset.dirty;setAdmin(t.dataset.uid,t.checked);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;preserve($('#main'),renderMain);}
  else if(t.id==='hq'){ui.hq=t.value;ui.histN=200;preserve($('#main'),renderMain);}
  else if(t.dataset&&t.dataset.team&&t.name&&t.name.startsWith('find-')){
    const team=t.dataset.team,q=t.value.trim();
    if(!user||!q){ui.hits[team]=[];const h=$('#hits-'+team);if(h)h.innerHTML='';return;}
    user.search(q).then(hits=>{ui.hits[team]=hits;const h=$('#hits-'+team);if(h)h.innerHTML=hitsHTML(team)||(t.value.trim()?'<span class="hint" style="margin:0">No matching people</span>':'');});
  }
});
$('#f').addEventListener('submit',submitForm);
$('#f').addEventListener('input',syncForm);
$('#f').addEventListener('change',syncForm);
$('#cof').addEventListener('submit',submitCo);
$('#cof').addEventListener('change',syncCo);
$('#detail').addEventListener('close',()=>{ui.openId=null;});

init();
})();

</script>
</body>
